# family-app Nginx 代理网关
# 职责：统一 80 端口入口，按路径分发到 backend / frontend
# 非目标：不处理 TLS 终止（生产部署可在外层再套）、不改请求主体、不越权处理业务逻辑

upstream backend_upstream {
    server backend:8080;
    keepalive 32;
}

upstream frontend_upstream {
    # frontend 容器改用 nginx serve build 产物（不再跑 Vite dev server）
    server frontend:80;
    keepalive 32;
}

# Change 11：微信公众号接入服务（验签/OAuth 分流；无 host 端口，仅经本网关暴露）
upstream wechat_upstream {
    server wechat-service:8900;
    keepalive 16;
}

# task-planner 工作任务服务（合并自 task-planner 子项目）
upstream tp_task_service_upstream {
    server tp-task-service:8100;
    keepalive 16;
}

upstream tp_agent_service_upstream {
    server tp-agent-service:8101;
    keepalive 16;
}

# WebSocket / HMR 协议切换（map 必须在 http{} 上下文，不能在 server{} 内部）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 同一路径兼容微信服务端回调与前端登录页；只有普通浏览器访问进入前端。
map "$request_method:$arg_signature:$arg_echostr" $wechat_callback_upstream {
    default  wechat_upstream;
    "GET::"  frontend_upstream;
    "HEAD::" frontend_upstream;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    charset utf-8;

    # 上传大小限制（家庭便签/图片上传预留）
    client_max_body_size 10M;

    # ----- Nginx 自身健康检查（容器 healthcheck 专用，不经过 upstream）-----
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ----- P0 安全边界：内部机器接口禁止经公网网关访问 -----
    # 内部服务必须通过 Compose DNS 直连 backend:8080，并继续携带 X-Internal-Secret。
    location = /api/internal {
        return 404;
    }

    location ^~ /api/internal/ {
        return 404;
    }

    # ----- task-planner 统一登录态子请求 -----
    # 只允许 auth_request 内部跳转；外部无法直接访问该 location。
    # 主应用以 X-Access-Token 为登录凭据，复用 /api/auth/me 的完整 TTL/注销校验。
    location = /_task_planner_auth {
        internal;
        proxy_pass http://backend_upstream/api/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Access-Token    $http_x_access_token;
        proxy_set_header X-Family-Id       $http_x_family_id;
    }
    # ----- SSE 长连接专用：AI 拆解 /chat/stream 端点 -----
    # 必须关闭缓冲 + 保留分块编码 + 延长读超时
    location /api/agent/v1/chat/stream {
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         "";

        proxy_buffering         off;
        proxy_cache             off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        proxy_connect_timeout 10s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;

        proxy_pass http://backend_upstream;
    }

    # ----- task-planner 工作任务 SSE：AI 对话流式拆解 -----
    # 与 /api/agent/v1/chat/stream 同范式：关闭缓冲 + 分块编码 + 长超时
    # 路径重写：/api/work-tasks/chat → /api/chat（agent-service 路由）
    location /api/work-tasks/chat {
        proxy_set_header X-Internal-Secret "";
        proxy_set_header X-Work-User-Id "";
        auth_request /_task_planner_auth;

        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         "";

        proxy_buffering         off;
        proxy_cache             off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        proxy_connect_timeout 10s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;

        proxy_pass http://tp_agent_service_upstream/api/chat;
    }

    # ----- task-planner 工作任务 REST：任务/分类/模板 CRUD -----
    # 路径重写：/api/work-tasks/tasks → /api/tasks（task-service 路由）
    location /api/work-tasks/ {
        proxy_set_header X-Internal-Secret "";
        proxy_set_header X-Work-User-Id "";
        auth_request /_task_planner_auth;

        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    60s;

        proxy_pass http://tp_task_service_upstream/api/;
    }

    # ----- 后端 API：/api/** 全部转 backend:8080 -----
    # 覆盖：auth / categories / tasks / families / agent/v1(除chat/stream)；internal 已在上方拒绝
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;

        proxy_connect_timeout 15s;
        proxy_send_timeout    60s;
        proxy_read_timeout    120s;

        proxy_pass http://backend_upstream;
    }

    # ----- Change 11 微信接入：服务端路由转 wechat-service，前端承接页单独分流 -----
    # 覆盖：服务器配置验签 GET/POST /wechat/callback、OAuth 入口 /wechat/authorize、
    #      授权回调 /wechat/oauth/callback（302 分流到 H5 fragment token / 绑定页票据）
    # 绑定页属于前端，必须优先于下方 /wechat/ 后端代理。
    location = /wechat/bind {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://frontend_upstream;
    }

    # 消息 POST 和带签名的 GET 验签仍走微信服务；登录跳转页走前端。
    location = /wechat/callback {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$wechat_callback_upstream;
    }

    location /wechat/ {
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        proxy_pass http://wechat_upstream;
    }

    # 可选每日授权路由；基础镜像没有片段，默认不开放。
    include /etc/nginx/daily-optional/*.conf;

    # ----- 前端静态资源（build 产物，由 frontend 容器内 nginx serve）-----
    # 覆盖：SPA 根路由 / /login /tasks /families /categories 等
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_pass http://frontend_upstream;
    }
}
