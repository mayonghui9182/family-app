# 可选 HTTPS 源站入口：仅由 docker-compose.tls.yml 挂载证书后加载。
# Cloudflare Tunnel 默认回源到 80；启用本文件前应同步将 Tunnel service 改为 https://localhost:443。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;
    charset utf-8;
    client_max_body_size 10M;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 内部接口仅允许服务通过 Docker 网络直连，HTTPS 同样禁止公网访问。
    location = /api/internal {
        return 403;
    }
    location ^~ /api/internal/ {
        return 403;
    }

    location /api/agent/v1/chat/stream {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_pass http://backend_upstream;
    }

    # 工作服务自身再次核验令牌及数据归属，HTTPS 与 HTTP 路由一致。
    location /api/work-tasks/chat {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Access-Token $http_x_access_token;
        proxy_set_header X-Internal-Secret "";
        proxy_set_header X-Work-User-Id "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_pass http://tp_agent_service_upstream/api/chat;
    }
    location /api/work-tasks/ {
        proxy_set_header Host $host;
        proxy_set_header X-Access-Token $http_x_access_token;
        proxy_set_header X-Internal-Secret "";
        proxy_set_header X-Work-User-Id "";
        proxy_pass http://tp_task_service_upstream/api/;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
        proxy_pass http://backend_upstream;
    }

    # 绑定页属于前端，必须优先于下方 /wechat/ 后端代理。
    location = /wechat/bind {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://frontend_upstream;
    }

    # 消息 POST 和带签名的 GET 验签仍走微信服务；登录跳转页走前端。
    location = /wechat/callback {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$wechat_callback_upstream;
    }

    location /wechat/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_pass http://wechat_upstream;
    }

    # 与 HTTP 共用可选片段，只有显式挂载时才加载。
    include /etc/nginx/daily-optional/*.conf;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_pass http://frontend_upstream;
    }
}
