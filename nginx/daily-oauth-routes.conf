# 仅可选覆盖层挂载；公开读取入口使用 OAuth，不传递原应用令牌或机器身份头。
location = /mcp/daily {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Access-Token "";
    proxy_set_header X-Internal-Secret "";
    proxy_set_header X-Work-User-Id "";
    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_pass http://daily-mcp:9011;
}
location = /.well-known/oauth-protected-resource/mcp/daily {
    proxy_set_header Host $host;
    proxy_pass http://daily-mcp:9011;
}
# RFC 8414 发现地址将 issuer 路径放在 well-known 之后。
location = /.well-known/oauth-authorization-server/daily-oauth {
    proxy_set_header Host $host;
    proxy_pass http://daily-oauth:9010/daily-oauth/.well-known/oauth-authorization-server;
}
# 内省仅由 MCP 服务通过容器内网调用，不开放公网。
location = /daily-oauth/oauth2/introspect { return 404; }
location /daily-oauth/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Access-Token "";
    proxy_set_header X-Internal-Secret "";
    proxy_set_header X-Work-User-Id "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_pass http://daily-oauth:9010;
}
