# family-app 前端静态资源服务（生产构建产物）
# 职责：serve dist/ 静态文件 + SPA history 路由 fallback 到 index.html
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 静态资源长缓存（Vite 产物带 hash）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback：所有非文件请求返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
