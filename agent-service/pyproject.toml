[project]
name = "agent-service"
version = "0.1.0"
description = "family-app AI 拆解服务（A-1 SSE / B-1 拆解 / B-2 总结入口）"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "apscheduler>=3.10",
    "httpx[http2]>=0.27",
    "sqlalchemy[asyncio]>=2",
    "asyncpg>=0.29",
    "loguru>=0.7",
    "pydantic>=2",
    "pydantic-settings>=2.2",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Depends() 默认参数是 FastAPI 官方惯用法
"app/routes/*.py" = ["B008"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
testpaths = ["tests"]
